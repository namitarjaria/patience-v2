<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Patience</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="booting">
    <header class="topbar">
      <div class="title">Patience</div>
      <div class="controls">
        <button id="redealBtn" class="btn">Redeal</button>
        <button id="foundationsBtn" class="btn foundations-btn" title="View foundations" style="display: none;">
          <span class="foundations-icon">🏆</span>
          <span class="foundations-badge">0</span>
        </button>
        <button id="undoBtn" class="btn" disabled>Undo</button>
        <button id="rulesTopBtn" class="btn" title="View rules">Rules</button>
        <button id="hintBtn" class="btn">Hint</button>
        <button id="testWinBtn" class="btn" title="Preview win animation">Test Win</button>
      </div>
    </header>

    <main id="gameRoot">
      <section id="foundationArea" aria-label="Foundations">
        <div class="foundation-slot" data-suit="S" title="Spades"></div>
        <div class="foundation-slot" data-suit="H" title="Hearts"></div>
        <div class="foundation-slot" data-suit="D" title="Diamonds"></div>
        <div class="foundation-slot" data-suit="C" title="Clubs"></div>
      </section>

      <section id="tableauArea" aria-label="Tableau (13 columns)">
        <!-- 13 columns created by JS if not present -->
      </section>

      <!-- Card layer: all cards are absolutely positioned inside this layer for smooth animation -->
      <div id="cardLayer" aria-hidden="true"></div>
    </main>

    <footer class="bottombar">
      <span id="statusText"></span>
    </footer>

    <!-- Foundations Modal -->
    <div id="foundationsModal" class="foundations-modal" style="display: none;">
      <div class="foundations-modal-backdrop"></div>
      <div class="foundations-modal-content">
        <div class="foundations-modal-header">
          <h2>Foundations</h2>
          <button class="foundations-modal-close" aria-label="Close">×</button>
        </div>
        <div class="foundations-grid" id="foundationsGrid">
          <!-- Foundation cards will be inserted here -->
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
